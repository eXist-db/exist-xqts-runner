name: Release

# Triggered by a tag push (bare semver, e.g. 2.0.0, 2.0.0-RC3 — no 'v' prefix).
# Publish target:
#   - a final-release tag (bare X.Y.Z) on main -> GA release -> Maven Central
#   - anything else (RCs and other pre-release tags, or tags off main)
#     -> RC/interim -> publish to GitHub Packages
# Maven Central is immutable — only final releases may ever land there.

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine publish target
        run: |
          git fetch origin main
          # Central only for a final-release tag (bare X.Y.Z, no pre-release
          # suffix) whose commit is on main; RCs etc. go to GitHub Packages.
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              && git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "PUBLISH_TARGET=central" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TARGET=ghp" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: '1.12.11'

      - name: Import GPG key
        env:
          EXISTDB_RELEASE_KEY: ${{ secrets.EXISTDB_RELEASE_KEY }}
        run: echo "$EXISTDB_RELEASE_KEY" | base64 --decode | gpg --batch --import

      - name: Publish to Maven Central
        if: env.PUBLISH_TARGET == 'central'
        env:
          PGP_PASSPHRASE: ${{ secrets.EXISTDB_RELEASE_KEY_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: sbt publishSigned sonatypeBundleRelease

      - name: Publish to GitHub Packages
        if: env.PUBLISH_TARGET == 'ghp'
        env:
          PGP_PASSPHRASE: ${{ secrets.EXISTDB_RELEASE_KEY_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TO_GITHUB: 'true'
        run: sbt publishSigned
